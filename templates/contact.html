<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ t.header }}</title>
</head>
<body style="margin:0; padding:0; background-color:#FDFCF5; font-family:'Open Sans','Nunito',Arial,sans-serif; color:#333333; -webkit-text-size-adjust:100%;">

  <!-- Hidden preheader for the inbox preview -->
  <div style="display:none; max-height:0; overflow:hidden; line-height:1px; font-size:1px; color:#FDFCF5;">{{ t.header }}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%; background-color:#FDFCF5; padding:28px 12px;">
    <tr>
      <td align="center">

        <!-- Card -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%; max-width:600px; background-color:#FFFFFF; border:2px solid #2E7D32; border-radius:16px;">

          <!-- Brand bar -->
          <tr>
            <td style="padding:22px 32px 18px 32px; border-bottom:2px solid #EEEEEE;">
              <span style="font-family:'Nunito',Arial,sans-serif; font-size:22px; font-weight:800; color:#2E7D32; letter-spacing:-0.5px;">MoveWiz</span>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td style="padding:24px 32px 0 32px;">
              <h1 style="margin:0; font-family:'Nunito',Arial,sans-serif; font-size:26px; font-weight:800; line-height:1.3; color:#333333;">{{ t.header }}</h1>
              <div style="width:48px; height:3px; background-color:#D86C1F; border-radius:2px; margin-top:12px;"></div>
            </td>
          </tr>

          <!-- Intro -->
          <tr>
            <td style="padding:18px 32px 0 32px; font-size:15px; line-height:1.6; color:#666666;">{{ intro }}</td>
          </tr>

          <!-- Sender -->
          <tr>
            <td style="padding:22px 32px 0 32px; font-size:14px; line-height:1.6;">
              <span style="color:#666666;">{{ t.from }}:</span>
              <span style="font-weight:700; color:#333333; word-break:break-word;">{{ senderEmail }}</span>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="padding:16px 32px 0 32px;">
              <div style="background-color:#FAFAF5; border-radius:10px; padding:16px 18px; font-size:15px; line-height:1.6; color:#333333; white-space:pre-wrap;">{{ message }}</div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:26px 32px 28px 32px; border-top:2px solid #EEEEEE; margin-top:24px;">
              <p style="margin:0; font-size:13px; line-height:1.6; color:#999999; text-align:center;">{{ t.footer }}</p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
